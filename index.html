<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="google-site-verification" content="-KfvcGQaWPa3VY7i83rcCBUx_ogHYgtOfugsaaaQpRA" />
<title>HBS Dental — Remote Dental Operations Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Favicons and PWA manifest -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F7A6D">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#16323C; --ink-soft:#43585F;
  --bg:#F6F8F7; --surface:#FFFFFF;
  --teal:#1F7A6D; --teal-deep:#0E4C48;
  --mint:#DCEFE9; --coral:#F0654A; --coral-soft:#FBE3DD;
  --sand:#F3EDE4; --line:#E1E9E6;
  --shadow:0 18px 50px -24px rgba(14,76,72,.28);
  --shadow-sm:0 8px 24px -14px rgba(14,76,72,.30);
  --disp:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:20px; --rs:14px;
  --wrap:1180px;
  --topbar-bg:linear-gradient(90deg,#0f2430 0%,#16323c 55%,#1b3e4f 100%);
  --topbar-text:rgba(255,255,255,.94);
  --topbar-muted:rgba(255,255,255,.76);
  --topbar-border:rgba(255,255,255,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
/* Ensure interactive SPA hooks show pointer */
[data-go]{cursor:pointer}
.site-topbar-link{cursor:pointer}
/* Force pointer on children so icons/text inside anchors also show hand */
[data-go], [data-go] * { cursor: pointer !important; }
/* Ensure nav and topbar elements are on top and accept clicks */
.site-topbar, .dental-nav { position: relative; z-index: 9999; }
.nav-right a, .nav-right .nav-cta, .site-topbar-link, .brand { cursor: pointer !important; pointer-events: auto; z-index: 10000; }
img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

.site-topbar{background:linear-gradient(90deg,#0f2430 0%,#16323c 55%,#1b3e4f 100%);border-bottom:1px solid rgba(255,255,255,.16);max-width: none;color:var(--topbar-text);box-shadow:0 10px 30px -20px rgba(0,0,0,.35)}
.site-topbar-inner{width: 100%;margin:0 auto;padding:0 24px;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.site-topbar-link{display:inline-flex;align-items:center;gap:.55rem;padding:.24rem .5rem;border-radius:10px;transition:transform .2s ease,color .2s ease,background-color .2s ease,box-shadow .2s ease;color:var(--topbar-muted);font-size:.9rem;font-family:var(--body);font-weight:500;line-height:1.2;letter-spacing:.01em}
/* .site-topbar-link:hover{color:#fff;background:rgba(255,255,255,.14);transform:translateY(-1px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)} */
.site-topbar-link .icon{display:inline-grid;place-items:center;width:18px;height:18px;color:#fff;flex:none;opacity:.95;transition:transform .2s ease}
.phone-link:hover .icon{animation:phone-ring .7s ease-in-out infinite;transform-origin:center}
@keyframes phone-ring{0%,100%{transform:rotate(0deg) scale(1)}10%{transform:rotate(-8deg) scale(1.06)}20%{transform:rotate(8deg) scale(1.06)}30%{transform:rotate(-6deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.04)}50%{transform:rotate(-3deg) scale(1.02)}60%{transform:rotate(3deg) scale(1.02)}}

/* ============ TYPE ============ */
h1,h2,h3{font-family:var(--disp);font-weight:500;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:500}
.section-eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:1rem}
.section-eyebrow::before{content:"";width:26px;height:1px;background:var(--teal);opacity:.5}
.section-title{font-size:clamp(1.7rem,3.6vw,2.7rem)}
.section-subtitle{font-size:1.05rem;color:var(--ink-soft);max-width:56ch;margin-top:.9rem}

/* ============ NAV ============ */
.dental-nav{position:sticky;top:0;z-index:60;background:rgba(246,248,247,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(225,233,230,.95);box-shadow:0 10px 30px -18px rgba(22,50,60,.18)}
.dental-nav-inner{position:relative;display:flex;align-items:center;justify-content:space-between;height:78px;width:100%;max-width:none;margin:0;padding:0 22px;gap:1rem}
.nav-left{display:flex;align-items:center;gap:.7rem;padding-left:8px}
.nav-center{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:none;display:flex;justify-content:center;padding:0}
.nav-right{display:flex;align-items:center;gap:.6rem;padding-right:8px}
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--disp);font-size:1.22rem;font-weight:600;letter-spacing:-.02em;color:var(--ink);padding:.4rem .3rem .4rem 0;border-radius:10px;transition:transform .2s ease,color .2s ease;background:none;border:none;cursor:pointer}
.brand:hover{color:var(--teal-deep);transform:translateY(-1px)}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:.92rem;font-weight:500;box-shadow:0 12px 26px -16px rgba(15,89,77,.7)}
.brand small{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;display:block;line-height:1}
.nav-home{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:rgba(31,122,109,.08);border:1px solid var(--teal);border-radius:10px;cursor:pointer;color:var(--teal);transition:transform .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease;padding:.5rem .75rem;flex:none;font-family:var(--body);font-size:.9rem;font-weight:500;text-decoration:none}
.nav-home:hover{color:var(--teal);background:rgba(31,122,109,.08);border-color:var(--teal);transform:translateY(-1px);box-shadow:0 8px 16px -12px rgba(22,50,60,.18)}
.nav-links{display:flex;align-items:center;gap:.25rem;margin-left:0}
.nav-links button,.nav-links a{font-family:var(--body);font-size:.92rem;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:.7rem .8rem;border-radius:10px;transition:color .2s ease,background-color .2s ease,transform .2s ease,box-shadow .2s ease;white-space:nowrap;position:relative;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.nav-links button::after,.nav-links a::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:.28rem;height:2px;border-radius:10px;background:var(--teal);transform:scaleX(0);transform-origin:center;transition:transform .2s ease}
.nav-links button:hover,.nav-links a:hover{color:var(--ink);background:rgba(31,122,109,.08);transform:translateY(-1px)}
.nav-links button:hover::after,.nav-links a:hover::after,.nav-links button.active::after,.nav-links a.active::after{transform:scaleX(1)}
.nav-links button.active,.nav-links a.active{color:var(--teal-deep);background:rgba(31,122,109,.1);font-weight:600;box-shadow:inset 0 0 0 1px rgba(31,122,109,.08)}
.nav-cta{background:linear-gradient(135deg,var(--coral),#e0543a)!important;color:#fff!important;font-weight:600;padding:.72rem 1.15rem!important;border-radius:10px!important;box-shadow:0 16px 30px -16px rgba(240,101,74,.75)!important;transition:transform .2s ease,box-shadow .2s ease,background .2s ease!important}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 20px 34px -16px rgba(240,101,74,.8)!important}
.back-hbs{font-family:var(--mono);font-size:.69rem;letter-spacing:.06em;color:var(--ink-soft);border:1px solid var(--line);padding:.5rem .75rem;border-radius:10px;background:rgba(255,255,255,.7);transition:color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.back-hbs:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(22,50,60,.2)}
.burger{display:none;background:rgba(255,255,255,.9);border:1px solid rgba(225,233,230,.95);border-radius:12px;width:46px;height:42px;cursor:pointer;flex-direction:column;gap:4px;align-items:center;justify-content:center;box-shadow:0 10px 22px -16px rgba(22,50,60,.22);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.burger:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px rgba(22,50,60,.24)}
.burger span{width:20px;height:2px;background:var(--ink);border-radius:2px;transition:.25s}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.mobile-menu{display:none}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--body);font-weight:500;font-size:.98rem;padding:.85rem 1.5rem;border-radius:10px;cursor:pointer;border:none;transition:.22s;white-space:nowrap}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 12px 26px -14px rgba(240,101,74,.8)}
.btn-primary:hover{background:#e0543a;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--teal-deep);border:1.5px solid var(--teal);}
.btn-ghost:hover{background:var(--teal);color:#fff}
.btn-white{background:#fff;color:var(--teal-deep)}
.btn-white:hover{transform:translateY(-2px)}
.btn .arw{transition:.22s}
.btn:hover .arw{transform:translateX(3px)}

/* ============ HERO ============ */
.dental-hero{position:relative;padding:clamp(2.5rem,6vw,5rem) 0 clamp(3rem,7vw,6rem);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,4vw,4rem);align-items:center}
.dental-hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--mint);color:var(--teal-deep);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:.45rem .9rem;border-radius:10px;text-transform:uppercase}
.dental-hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dental-hero-title{font-size:clamp(2.3rem,5.4vw,4rem);margin:1.3rem 0 1.1rem}
.dental-hero-title em{font-style:italic;color:var(--teal)}
.dental-hero-subtitle{font-size:clamp(1.02rem,1.6vw,1.18rem);color:black;max-width:46ch}
.dental-hero-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.9rem}
.hero-trust{display:flex;gap:1.6rem;margin-top:2.2rem;flex-wrap:wrap}
.hero-trust div{display:flex;flex-direction:column}
.hero-trust b{font-family:var(--disp);font-size:1.5rem;color:var(--teal-deep)}
.hero-trust span{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase}
.hero-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:-1}
.hero-blob.a{width:420px;height:420px;background:var(--mint);top:-120px;right:-80px}
.hero-blob.b{width:300px;height:300px;background:var(--coral-soft);bottom:-100px;left:-60px;opacity:.6}

/* ============ CONSOLE (signature) ============ */
.console{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:1.2rem;position:relative}
.console-bar{display:flex;align-items:center;gap:.5rem;padding:.2rem .3rem .9rem}
.console-bar .lights{display:flex;gap:.4rem}
.console-bar .lights i{width:9px;height:9px;border-radius:50%;display:block}
.console-bar .lights i:nth-child(1){background:#F0654A}
.console-bar .lights i:nth-child(2){background:#F2C14E}
.console-bar .lights i:nth-child(3){background:#5FBE9B}
.console-bar b{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em;margin-left:auto}
.console-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.9rem}
.mini h5{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.7rem;font-weight:400}
.queue-item{display:flex;align-items:center;gap:.6rem;font-size:.82rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.queue-item:last-child{border-bottom:none}
.queue-item .av{width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--teal-deep);font-family:var(--mono);font-size:.62rem;display:grid;place-items:center;flex:none}
.queue-item .st{margin-left:auto;font-family:var(--mono);font-size:.6rem;padding:.15rem .45rem;border-radius:6px}
.st.live{background:var(--coral-soft);color:var(--coral)}
.st.done{background:var(--mint);color:var(--teal)}
.checklist li{display:flex;align-items:center;gap:.55rem;font-size:.82rem;padding:.32rem 0;color:var(--ink-soft)}
.checklist .tick{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:.3s}
.checklist li.on .tick{background:var(--teal);border-color:var(--teal)}
.checklist li.on .tick svg{opacity:1}
.checklist .tick svg{opacity:0;transition:.3s}
.checklist li.on{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:70px;margin-top:.3rem}
.bars .bar{flex:1;background:linear-gradient(var(--teal),var(--mint));border-radius:6px 6px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.ar-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);margin-top:.5rem}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ============ SECTIONS ============ */
.dental-section{padding:clamp(3rem,7vw,6rem) 0}
.dental-section.alt{background:var(--surface)}
.dental-section.sand{background:var(--sand)}
.center{text-align:center;margin:0 auto}
.center .section-subtitle{margin-left:auto;margin-right:auto}

/* pain grid */
.pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:2.6rem}
.pain-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;position:relative;overflow:hidden}
.pain-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:.35s}
.pain-card:hover::before{transform:scaleX(1)}
.pain-card .pn{font-family:var(--mono);font-size:.7rem;color:var(--coral);letter-spacing:.1em}
.pain-card h4{font-family:var(--disp);font-size:1.2rem;margin:.6rem 0 .5rem}
.pain-card p{font-size:.92rem;color:var(--ink-soft)}

/* services */
.dental-service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:2.6rem}
.dental-service-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.7rem 1.5rem;transition:.3s}
.dental-service-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--mint)}
.svc-ic{width:48px;height:48px;border-radius:13px;background:var(--mint);display:grid;place-items:center;color:var(--teal-deep);margin-bottom:1.1rem}
.dental-service-card h4{font-family:var(--disp);font-size:1.25rem;margin-bottom:.5rem}
.dental-service-card p{font-size:.93rem;color:var(--ink-soft)}

/* split image section */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,4vw,3.5rem);align-items:center}
.split.rev .split-media{order:-1}
.split-media{border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);aspect-ratio:4/3;background:var(--mint)}
.split-media img{width:100%;height:100%;object-fit:cover}
.split ul{list-style:none;margin-top:1.5rem;display:grid;gap:.9rem}
.split ul li{display:flex;gap:.7rem;font-size:.98rem;color:var(--ink-soft)}
.split ul li .chk{width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--teal);flex:none;display:grid;place-items:center;margin-top:2px}

/* workflow timeline */
.dental-process-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:3rem;position:relative}
.dental-process-step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem}
.dental-process-step .num{font-family:var(--mono);font-size:.8rem;color:#fff;background:var(--teal);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:1rem}
.dental-process-step h4{font-family:var(--disp);font-size:1.12rem;margin-bottom:.4rem}
.dental-process-step p{font-size:.88rem;color:var(--ink-soft)}

/* AI human */
.ai-human-section .ai-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:2.6rem}
.ai-col{border-radius:var(--r);padding:2rem;border:1px solid var(--line)}
.ai-col.ai{background:linear-gradient(160deg,var(--mint),#fff)}
.ai-col.human{background:linear-gradient(160deg,var(--coral-soft),#fff)}
.ai-col h3{font-size:1.5rem;margin-bottom:.4rem}
.ai-col .tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.ai-col ul{list-style:none;margin-top:1.2rem;display:grid;gap:.7rem}
.ai-col li{font-size:.94rem;color:var(--ink-soft);display:flex;gap:.6rem}
.ai-col li::before{content:"—";color:var(--teal)}

/* outcomes / stats */
.dental-outcome-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-top:2.6rem}
.dental-outcome-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.7rem;text-align:center}
.dental-outcome-card b{font-family:var(--disp);font-size:2.6rem;color:var(--teal-deep);display:block;line-height:1}
.dental-outcome-card span{font-size:.9rem;color:var(--ink-soft);display:block;margin-top:.6rem}

/* comparison */
.dental-comparison-section .cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:2.4rem;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.cmp-col{padding:2rem}
.cmp-col.before{background:var(--sand)}
.cmp-col.after{background:linear-gradient(160deg,var(--teal-deep),var(--teal));color:#fff}
.cmp-col h4{color:inherit;font-size:1.3rem;margin-bottom:1.2rem;font-family:var(--disp)}
.cmp-col.after h4{color:#fff}
.cmp-col ul{list-style:none;display:grid;gap:.8rem}
.cmp-col li{font-size:.94rem;display:flex;gap:.6rem}
.cmp-col.before li{color:var(--ink-soft)}
.cmp-col.after li{color:rgba(255,255,255,.92)}
.cmp-col li .mk{flex:none}

/* banner */
.dental-banner{border-radius:26px;overflow:hidden;position:relative;padding:clamp(2.5rem,5vw,4rem);color:#fff;background:linear-gradient(120deg,var(--teal-deep),var(--teal))}
.dental-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(240,101,74,.4),transparent 45%);pointer-events:none}
.dental-banner .bnr-in{position:relative;max-width:60ch}
.dental-banner h3{color:#fff;font-size:clamp(1.6rem,3.4vw,2.5rem);margin-bottom:.9rem}
.dental-banner p{color:rgba(255,255,255,.88);font-size:1.05rem;margin-bottom:1.6rem}

/* faq */
.faq-section .faq-wrap{max-width:820px;margin:2.4rem auto 0}
.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);margin-bottom:.8rem;overflow:hidden}
.faq-q{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:1.2rem 1.4rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;font-family:var(--disp);font-size:1.08rem;color:var(--ink)}
.faq-q .pm{font-family:var(--mono);color:var(--teal);transition:.3s;flex:none}
.faq-item.open .faq-q .pm{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 1.4rem}
.faq-item.open .faq-a{max-height:300px;padding-bottom:1.3rem}
.faq-a p{font-size:.95rem;color:var(--ink-soft)}

/* cta */
.dental-cta-section{padding:clamp(3rem,6vw,5rem) 0}
.dental-cta-banner{background:linear-gradient(135deg,var(--teal-deep),var(--teal));border-radius:28px;padding:clamp(2.5rem,5vw,4.5rem);text-align:center;color:#fff;position:relative;overflow:hidden}
.dental-cta-banner::before{content:"";position:absolute;width:380px;height:380px;background:rgba(240,101,74,.35);border-radius:50%;filter:blur(80px);top:-140px;right:-80px}
.dental-cta-banner .of{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);position:relative}
.dental-cta-title{color:#fff;font-size:clamp(1.8rem,4vw,3rem);margin:.9rem 0 1rem;position:relative}
.dental-cta-text{color:rgba(255,255,255,.9);max-width:52ch;margin:0 auto 1.9rem;position:relative}
.dental-cta-actions{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;position:relative}

/* footer */
.dental-footer{background:var(--ink);color:rgba(255,255,255,.7);padding:3.5rem 0 2rem}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2rem}
.dental-footer h5{color:#fff;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.1rem}
.dental-footer a,.dental-footer button{display:block;color:rgba(255,255,255,.7);background:none;border:none;font-family:var(--body);font-size:.92rem;padding:.3rem 0;cursor:pointer;text-align:left}
.dental-footer a:hover,.dental-footer button:hover{color:#fff}
.foot-brand p{font-size:.92rem;margin-top:1rem;max-width:34ch}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:2.5rem;padding-top:1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-size:.82rem;font-family:var(--mono)}

/* reveal animation */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

/* sticky mobile cta */
.sticky-cta{display:none}

/* ============ CONTACT ============ */
.contact-layout{display:grid;grid-template-columns:1.4fr .85fr;gap:1.6rem;align-items:start}
.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.contact-form .field{display:flex;flex-direction:column;gap:.4rem}
.contact-form .field-full{grid-column:1/-1}
.contact-form label{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.contact-form input,.contact-form select,.contact-form textarea{padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;font-family:var(--body);font-size:.95rem;background:var(--bg);color:var(--ink);width:100%}
.contact-form input:focus,.contact-form select:focus,.contact-form textarea:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff}
.contact-form textarea{min-height:120px;resize:vertical}
.contact-side{display:grid;gap:1.2rem}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;box-shadow:var(--shadow-sm)}
.info-row{display:flex;align-items:center;gap:.9rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.info-row:last-of-type{border-bottom:none}
.info-ic{width:40px;height:40px;border-radius:11px;background:var(--mint);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.info-row span small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.15rem}
.info-row span{font-size:.95rem;color:var(--ink)}
.info-stats{display:flex;justify-content:space-between;gap:.5rem;margin:1.3rem 0;padding:1.1rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info-stats div{text-align:center}
.info-stats b{font-family:var(--disp);font-size:1.5rem;color:var(--teal-deep);display:block;line-height:1}
.info-stats span{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.hipaa{background:var(--mint);border-radius:12px;padding:.9rem 1rem}
.hipaa p{font-size:.85rem;color:var(--teal-deep);margin-top:.35rem}
.hours{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--line);font-size:.94rem;color:var(--ink-soft)}
.hours:last-child{border-bottom:none}
.hours b{color:var(--ink);font-weight:500}

.page{display:none}
.page.active{display:block;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ============ RESPONSIVE ============ */
@media(max-width:940px){
  .nav-links,.back-hbs,.nav-home,.nav-cta{display:none}
  .burger{display:flex}
  .mobile-menu{display:block;position:fixed;inset:118px 0 auto 0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:1rem 16px 1.3rem;transform:translateY(-120%);transition:transform .3s ease,box-shadow .3s ease;z-index:55;box-shadow:0 12px 30px -16px rgba(14,76,72,.2)}
  .mobile-menu.open{transform:translateY(0)}
  .mobile-menu button,.mobile-menu a{display:block;width:100%;text-align:left;background:none;border:none;font-family:var(--body);font-size:1rem;padding:.9rem .2rem;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;transition:color .2s ease,padding-left .2s ease;text-decoration:none}
  .mobile-menu button:hover,.mobile-menu a:hover{color:var(--teal-deep);padding-left:.3rem}
  .mobile-menu .mm-cta{background:linear-gradient(135deg,var(--coral),#e0543a);color:#fff;border-radius:10px;text-align:center;margin-top:1rem;border:none;padding:.95rem 1rem;box-shadow:0 16px 28px -16px rgba(240,101,74,.8)}
  .mobile-menu .mm-back{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);border-bottom:none;padding-top:1rem}
  .hero-grid{grid-template-columns:1fr;gap:2.5rem}
  .console{max-width:460px;margin:0 auto}
  .pain-grid,.dental-service-grid,.dental-process-timeline,.dental-outcome-grid{grid-template-columns:1fr 1fr}
  .split,.ai-human-section .ai-cols,.dental-comparison-section .cmp,.contact-layout{grid-template-columns:1fr}
  .split.rev .split-media{order:0}
  .sticky-cta{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:.7rem 16px;gap:.7rem;box-shadow:0 -8px 24px -16px rgba(0,0,0,.3)}
  .sticky-cta .btn{flex:1;justify-content:center;font-size:.9rem;padding:.8rem}
  body{padding-bottom:70px}
}
@media(max-width:560px){
  .pain-grid,.dental-service-grid,.dental-process-timeline,.dental-outcome-grid{grid-template-columns:1fr}
  .console-row{grid-template-columns:1fr}
  .dental-hero-actions .btn,.dental-cta-actions .btn{width:100%;justify-content:center}
  .foot-grid{grid-template-columns:1fr 1fr}
  .hero-trust{gap:1.2rem}
  .contact-form{grid-template-columns:1fr}
  .site-topbar-inner{justify-content:center;flex-wrap:wrap;min-height:auto;padding:.45rem 16px;gap:.35rem .75rem}
  .site-topbar-link{font-size:.8rem;padding:.18rem .25rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}

/* ================= ROUTER + BEHAVIOR ================= */
document.getElementById('root').innerHTML=shell();

const pages={dental:'page-dental','call-support':'page-call-support','insurance-verification':'page-insurance-verification','rcm-billing':'page-rcm-billing','admin-support':'page-admin-support','book':'page-book'};
const routePages={'/':'dental','/call-support':'call-support','/insurance-verification':'insurance-verification','/rcm-billing':'rcm-billing','/admin-support':'admin-support','/contact':'book'};
function normalizePath(pathname){
  if(!pathname || pathname === '/') return '/';
  return pathname.replace(/\/+$/, '') || '/';
}
let io;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.12});
  document.querySelectorAll('.page.active .reveal').forEach(el=>io.observe(el));
  document.querySelectorAll('.page.active .checklist').forEach(list=>{
    [...list.children].forEach((li,i)=>setTimeout(()=>li.classList.add('on'),400+i*260));
  });
}
function syncNav(key){
  document.querySelectorAll('[data-nav-link]').forEach(link=>{
    const href=link.getAttribute('href')||'/';
    const isActive=href===routePath(key);
    link.classList.toggle('active',isActive);
  });
}
function go(key, updateHistory=true){
  const id=pages[key]||pages.dental;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  syncNav(key);
  document.getElementById('mm').classList.remove('open');
  document.getElementById('burger').classList.remove('open');
  if(updateHistory){
    const path=routePath(key);
    if(window.location.pathname!==path){window.history.pushState({},'',path);}
  }
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
  document.querySelectorAll('#'+id+' .reveal').forEach(el=>el.classList.remove('in'));
  document.querySelectorAll('#'+id+' .checklist li').forEach(li=>li.classList.remove('on'));
  setTimeout(observe,40);
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.dataset.go);return;}
  const f=e.target.closest('.faq-q'); if(f){f.parentElement.classList.toggle('open');return;}
});
// Robust per-element handler (capture phase) to ensure clicks on [data-go] are handled
document.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',function(evt){
    // Skip form submit buttons
    if(this.tagName && this.tagName.toLowerCase()==='button' && this.type==='submit') return;
    evt.preventDefault();
    evt.stopPropagation();
    const key = this.dataset.go;
    if(key) go(key);
  }, {capture:true});
});
const burger = document.getElementById('burger');
const mobileMenu = document.getElementById('mm');
function closeMobileMenu(){
  mobileMenu.classList.remove('open');
  burger.classList.remove('open');
  document.body.classList.remove('mobile-menu-open');
}
burger.addEventListener('click',()=>{
  const isOpen = mobileMenu.classList.toggle('open');
  burger.classList.toggle('open', isOpen);
  document.body.classList.toggle('mobile-menu-open', isOpen);
});
window.addEventListener('scroll', ()=> {
  if (mobileMenu.classList.contains('open')) closeMobileMenu();
}, { passive: true });
window.addEventListener('wheel', ()=> {
  if (mobileMenu.classList.contains('open')) closeMobileMenu();
}, { passive: true });
window.addEventListener('touchmove', ()=> {
  if (mobileMenu.classList.contains('open')) closeMobileMenu();
}, { passive: true });
window.addEventListener('popstate',()=>{
  const path = normalizePath(window.location.pathname);
  go(routePages[path]||'dental',false);
});
const initialPath = normalizePath(window.location.pathname);
go(routePages[initialPath]||'dental',false);

</script>
